<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title id="portal-title">My Drive - Google Drive</title>
  <link id="portal-favicon" rel="icon" type="image/png"
    href="https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png">

  <!-- Apple Web App & iPadOS Safari Hardware Constraints -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Google Drive">
  <meta name="theme-color" content="#06070a">

  <!-- Typography: Modern Geometric Sans & Monospace -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-darkest: #040507;
      --bg-base: #08090d;
      --bg-sidebar: #06070a;
      --bg-surface: #0e1017;
      --bg-surface-elevated: #141722;
      --bg-surface-hover: #1c2030;
      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent-secondary: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --text-faint: #334155;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focused: rgba(99, 102, 241, 0.6);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --transition-fast: 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-smooth: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
    }

    body.modal-open {
      overflow: hidden !important;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-darkest);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-surface-elevated);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-primary);
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
    }

    .app-sidebar {
      width: 190px;
      flex: 0 0 190px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 10px;
      user-select: none;
      z-index: 50;
    }

    .sidebar-brand {
      padding: 4px 8px 16px;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .sidebar-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      text-align: left;
      transition: all var(--transition-fast);
    }

    .nav-item svg {
      flex-shrink: 0;
      color: currentColor;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .nav-lock {
      margin-left: auto;
      opacity: 0.45;
      display: flex;
      align-items: center;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 8px 4px;
    }

    .sidebar-heading {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      padding: 8px 12px 4px;
    }

    .sidebar-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .sign-in-btn {
      color: #cbd5e1;
    }

    .sign-in-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .sidebar-socials {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
    }

    .social-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .social-icon:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .sidebar-copyright {
      font-size: 0.62rem;
      color: var(--text-dim);
      padding: 0 8px;
      line-height: 1.3;
    }

    .main-viewport {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-base);
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(8, 9, 13, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo-accent {
      color: #fff;
    }

    .logo-sub {
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 500;
      margin-left: 4px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .online-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 10px;
      border-radius: var(--radius-full);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      animation: livePulse 2s infinite ease-in-out;
    }

    @keyframes livePulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    .stealth-select {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all var(--transition-fast);
    }

    .stealth-select:hover,
    .stealth-select:focus {
      border-color: var(--accent-secondary);
      color: #fff;
      background: var(--bg-surface-elevated);
    }

    .header-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
      font-family: var(--font-sans);
    }

    .header-btn:hover {
      background: var(--bg-surface-elevated);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .header-btn.active {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
    }

    .popout-btn {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .popout-btn:hover {
      background: rgba(16, 185, 129, 0.3);
      color: #fff;
    }

    .panic-btn {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.35);
      color: #fb7185;
    }

    .panic-btn:hover {
      background: var(--accent-rose);
      color: #fff;
    }

    .page-content {
      padding: 24px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    .hero-banner {
      position: relative;
      border-radius: var(--radius-lg);
      min-height: 180px;
      overflow: hidden;
      background: radial-gradient(circle at 80% 20%, #151a30 0%, #0c0e17 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      user-select: none;
    }

    .hero-title {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .hero-badge {
      font-size: 0.8rem;
      color: #818cf8;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hero-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #000000;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      width: fit-content;
      margin-top: 6px;
      font-family: var(--font-sans);
    }

    .hero-cta-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.4);
    }

    .hero-nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .hero-nav-arrow:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .hero-prev {
      left: 12px;
    }

    .hero-next {
      right: 12px;
    }

    .hero-dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }

    .hero-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hero-dot.active {
      width: 18px;
      border-radius: 4px;
      background: #fff;
    }

    .curated-section {
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    .curated-scroll-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .curated-scroll-row::-webkit-scrollbar {
      display: none;
    }

    .curated-card {
      flex: 0 0 92px;
      max-width: 92px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      outline: none;
      transition: transform var(--transition-smooth);
    }

    .curated-card:hover {
      transform: translateY(-3px);
    }

    .curated-thumb-wrap {
      width: 92px;
      height: 92px;
      border-radius: 14px;
      overflow: hidden;
      background: #10131d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .curated-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
      transition: transform var(--transition-smooth);
    }

    .curated-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: #cbd5e1;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-align: left;
    }

    .catalog-filter-section {
      margin-bottom: 20px;
    }

    .search-box {
      position: relative;
      width: 100%;
      margin-bottom: 12px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      background: #0e1017;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0 44px 0 40px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      font-family: var(--font-sans);
      transition: all var(--transition-fast);
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px var(--accent-glow);
      background: #141722;
    }

    .search-shortcut {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: #181b28;
      border: 1px solid var(--border-subtle);
      color: var(--text-dim);
      font-size: 0.75rem;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 4px;
      pointer-events: none;
    }

    .category-nav-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .category-nav::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font-sans);
      transition: all var(--transition-fast);
    }

    .cat-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .cat-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.25);
    }

    .catalog-count-row {
      margin-top: 10px;
    }

    .catalog-count-text {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }

    .game-card {
      background: #0e1017;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition-smooth), border-color var(--transition-smooth), box-shadow var(--transition-smooth);
      outline: none;
      position: relative;
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #07080c;
      overflow: hidden;
    }

    .card-fallback-art {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      background: radial-gradient(circle at 50% 30%, #1a1e2f 0%, #090a10 100%);
      user-select: none;
      z-index: 0;
    }

    .card-fallback-art.cat-action {
      background: radial-gradient(circle at 50% 30%, #3e182a 0%, #090a10 100%);
      color: #fb7185;
    }

    .card-fallback-art.cat-sandbox {
      background: radial-gradient(circle at 50% 30%, #153328 0%, #090a10 100%);
      color: #34d399;
    }

    .card-fallback-art.cat-multiplayer {
      background: radial-gradient(circle at 50% 30%, #2b1f48 0%, #090a10 100%);
      color: #c084fc;
    }

    .card-fallback-art.cat-sports {
      background: radial-gradient(circle at 50% 30%, #163628 0%, #090a10 100%);
      color: #4ade80;
    }

    .card-fallback-art.cat-arcade {
      background: radial-gradient(circle at 50% 30%, #3d2c14 0%, #090a10 100%);
      color: #fbbf24;
    }

    .card-fallback-art.cat-puzzle {
      background: radial-gradient(circle at 50% 30%, #133342 0%, #090a10 100%);
      color: #22d3ee;
    }

    .card-fallback-art.cat-music {
      background: radial-gradient(circle at 50% 30%, #3b1940 0%, #090a10 100%);
      color: #f472b6;
    }

    .card-fallback-art.cat-shooter {
      background: radial-gradient(circle at 50% 30%, #3e1e1a 0%, #090a10 100%);
      color: #f87171;
    }

    .card-fallback-art.cat-racing {
      background: radial-gradient(circle at 50% 30%, #3d2315 0%, #090a10 100%);
      color: #fb923c;
    }

    .fallback-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      color: currentColor;
    }

    .fallback-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-smooth);
      z-index: 1;
      opacity: 1;
    }

    .game-card:hover .card-thumb {
      transform: scale(1.05);
    }

    .card-info {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tag-pill {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: lowercase;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
    }

    .infinite-scroll-sentinel {
      height: 20px;
      margin-top: 40px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }

    .empty-state.hidden {
      display: none;
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .game-modal {
      position: fixed;

          this.unlockWebAudio();

    class RuntimeLoader {

      async ensureRuffle() {

          this.ruffleLoaded = true;
          return window.RufflePlayer;
        }

        if (this.ruffleScriptLoading) {
          return new Promise((resolve) => {
            const check = setInterval(() => {
              if (window.RufflePlayer) {
                clearInterval(check);
                this.ruffleLoaded = true;
                resolve(window.RufflePlayer);
              }
            }, 50);
          });
        }

        this.ruffleScriptLoading = true;
        return new Promise((resolve, reject) => {
          window.RufflePlayer = window.RufflePlayer || {};
          window.RufflePlayer.config = {
            autoplay: 'on',
            unmuteOverlay: 'hidden',
            letterbox: 'on',
            forceScale: true,

            warnOnUnsupportedContent: false,

            wmode: 'direct',
            publicPath: 'https://unpkg.com/@ruffle-rs/ruffle/'

          const script = document.createElement('script');
          script.src = 'https://unpkg.com/@ruffle-rs/ruffle';
          script.async = true;
          script.onload = () => {
            this.ruffleLoaded = true;
            this.ruffleScriptLoading = false;
            resolve(window.RufflePlayer);
          };
          script.onerror = (err) => {
            this.ruffleScriptLoading = false;
            reject(new Error('Failed to load Ruffle WebAssembly engine from CDN'));
          };
          document.head.appendChild(script);

      async mountRuffleGame(game, updateStatus) {

            clearInterval(focusCheckInterval);
          }
        }, 150);

        player.addEventListener('pointerdown', () => focusRuffle());

            async mountEmulatorGame(game, updateStatus) {
        const core = game.core || 'gba';
        updateStatus(`Preparing ${game.title} (${core.toUpperCase()})...`);

        const rawRomUrl = game.romUrl || game.source;

        this.container.innerHTML = `
      <div id="ejs-game-wrapper" style="width: 100%; height: 100%; position: relative; background: #0b0f19; display: flex; align-items: center; justify-content: center;">
        <div id="ejs-game-player" style="width: 100%; height: 100%;"></div>
      </div>
    `;

        updateStatus(`Streaming ${(core || 'Console').toUpperCase()} WebAssembly Core...`);
        await this.ensureEmulatorJS();

        // Build robust multi-mirror list for the ROM (bypasses jsDelivr 20MB limit using raw.githubusercontent.com)
        const candidates = [];
        if (rawRomUrl) candidates.push(rawRomUrl);

        if (rawRomUrl && rawRomUrl.includes('cdn.jsdelivr.net/gh/')) {
          const rawGh = rawRomUrl.replace('cdn.jsdelivr.net/gh/', 'raw.githubusercontent.com/').replace('@main', '/main').replace('@master', '/master');
          if (!candidates.includes(rawGh)) candidates.push(rawGh);
        }

        if (game.fallbackSource && !candidates.includes(game.fallbackSource)) {
          candidates.push(game.fallbackSource);
        }

        updateStatus(`Streaming ROM for ${game.title}...`);
        let romBuffer = null;
        for (let i = 0; i < candidates.length; i++) {
          const candidateUrl = candidates[i];
          if (i > 0) updateStatus(`Mirror ${i} busy. Trying alternate CDN mirror...`);
          try {
            const res = await fetch(encodeURI(candidateUrl));
            if (res.ok) {
              const buf = await res.arrayBuffer();
              if (buf && buf.byteLength > 100) {
                romBuffer = buf;
                break;
              }
            }
          } catch (e) { }
        }

        let activeGameUrl = rawRomUrl;
        if (romBuffer) {
          // In-memory Blob URL eliminates all network/CORS errors in EmulatorJS!
          const blob = new Blob([romBuffer]);
          activeGameUrl = URL.createObjectURL(blob);
        }

        const config = {
          gameUrl: activeGameUrl,
          dataPath: 'https://cdn.jsdelivr.net/gh/a456pur/seraph@main/storage/emulatorjs/data/',
          system: core,
          gameName: game.title,
          color: '#6366f1',
          backgroundColor: '#0b0f19',
          alignStartButton: 'center',
          startOnLoad: true,
          volume: 1,
          mouse: false,
          multitouch: true
        };

        const playerContainer = document.getElementById('ejs-game-player');
        if (!playerContainer) return;

        window.EJS_emulator = new window.EmulatorJS('#ejs-game-player', config);

        this.currentInstance = playerContainer;
        this.currentEngineType = 'emulator';

        const focusEmulator = () => {
          try {
            const canvas = playerContainer.querySelector('canvas');
            if (canvas) {
              canvas.tabIndex = 0;
              canvas.focus({ preventScroll: true });
            }
          } catch (e) { }
        };

        const focusCheckInterval = setInterval(() => {
          const canvas = playerContainer.querySelector('canvas');
          if (canvas) {
            focusEmulator();
            clearInterval(focusCheckInterval);
          }
        }, 150);
        setTimeout(() => clearInterval(focusCheckInterval), 4000);
      }

      dispose() {
        if (!this.currentInstance) {
          this.container.innerHTML = '';
          return;
        }

        try {
          if (this.currentEngineType === 'ruffle') {
            const player = this.currentInstance;
            if (typeof player.pause === 'function') player.pause();
            const canvases = player.shadowRoot ? player.shadowRoot.querySelectorAll('canvas') : player.querySelectorAll('canvas');
            canvases.forEach(canvas => {
              try {
                const gl = canvas.getContext('webgl') || canvas.getContext('webgl2');
                if (gl) {
                  const numTextureUnits = gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS) || 8;
                  for (let unit = 0; unit < numTextureUnits; ++unit) {
                    gl.activeTexture(gl.TEXTURE0 + unit);
                    gl.bindTexture(gl.TEXTURE_2D, null);
                    gl.bindTexture(gl.TEXTURE_CUBE_MAP, null);
                  }
                  const ext = gl.getExtension('WEBGL_lose_context');
                  if (ext) ext.loseContext();
                }
                canvas.width = 1;
                canvas.height = 1;
              } catch (glErr) { }
            });
            if (typeof player.remove === 'function') player.remove();
          } else if (this.currentEngineType === 'emulator') {
            if (window.EJS_emulator) {
              try {
                if (typeof window.EJS_emulator.pause === 'function') window.EJS_emulator.pause();
              } catch (e) { }
              window.EJS_emulator = null;
            }
            const canvases = this.container.querySelectorAll('canvas');
            canvases.forEach(canvas => {
              try {
                const gl = canvas.getContext('webgl') || canvas.getContext('webgl2');
                if (gl) {
                  const numTextureUnits = gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS) || 8;
                  for (let unit = 0; unit < numTextureUnits; ++unit) {
                    gl.activeTexture(gl.TEXTURE0 + unit);
                    gl.bindTexture(gl.TEXTURE_2D, null);
                    gl.bindTexture(gl.TEXTURE_CUBE_MAP, null);
                  }
                  const ext = gl.getExtension('WEBGL_lose_context');
                  if (ext) ext.loseContext();
                }
                canvas.width = 1;
                canvas.height = 1;
              } catch (glErr) { }
            });
          } else if (this.currentEngineType === 'html5') {
            const iframe = this.currentInstance;
            iframe.src = 'about:blank';
            if (typeof iframe.remove === 'function') iframe.remove();
          }

          this.activeBlobUrls.forEach(url => URL.revokeObjectURL(url));
          this.activeBlobUrls = [];

          this.currentInstance = null;
          this.currentEngineType = null;
          this.container.innerHTML = '';
        } catch (disposalError) {
          console.warn('Disposal warning:', disposalError);
          this.container.innerHTML = '';
        }
      }

          );

            /class="game-modal[^"]*"/i,
            'class="game-modal hidden"'
          );

          const LT = String.fromCharCode(60);
          const GT = String.fromCharCode(62);
          if (activeGameId) {
            docHtml = docHtml.replace(
              LT + '/body' + GT,
              LT + 'script' + GT + 'window.__AUTO_LAUNCH_GAME_ID__ = "' + activeGameId + '";' + LT + '/script' + GT + LT + '/body' + GT
            );
          }

          const fullHtml = LT + '!DOCTYPE html' + GT + '\n' + LT + 'html lang="en"' + GT + '\n' + docHtml + '\n' + LT + '/html' + GT;

          try {
            const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
            const blobUrl = URL.createObjectURL(blob);
            const win = window.open(blobUrl, '_blank');
            if (win) return;
          } catch (blobErr) { }

          const win = window.open('about:blank', '_blank');

            win.document.open();
            win.document.write(fullHtml);

          this.catalog = await res.json();
        } catch (err) {
          console.warn('Failed to load local catalog.json, loading seed catalog...', err);
          try {
            const seedRes = await fetch('data/catalog-seed.json');
            this.catalog = await seedRes.json();
          } catch (seedErr) {
            this.catalog = [];
          }
        }

        this.applyFilters();
      }


      initHeroCarousel() {
        if (!this.dom.heroBanner) return;

        const featuredIds = [
          'friday-night-funkin',
          'fnf-vs-tricky',
          'fnf-vs-kapi',
          'fnf-vs-tabi',
          'dragon-ball-fierce-fighting-2-6',
          'crazy-zombie-9-0',
          'dragon-ball-fierce-fighting-2-1',
          'crazy-zombie-8-0',
          'geometry-dash',
          'super-mario-63',
          'retro-bowl',
          'undertale',
          'bad-monday-simulator',
          'dan-the-man',
          'slope',
          '1v1-lol'
        ];

        this.heroFeaturedGames = [];
        featuredIds.forEach(id => {
          const g = this.catalog.find(x => x.id === id);
          if (g) this.heroFeaturedGames.push(g);
        });

        if (this.heroFeaturedGames.length === 0 && this.catalog.length > 0) {
          this.heroFeaturedGames = this.catalog.slice(0, 6);
        }

        if (this.heroFeaturedGames.length === 0) return;

        if (this.dom.heroDots) {
          this.dom.heroDots.innerHTML = '';
          this.heroFeaturedGames.forEach((_, idx) => {
            const dot = document.createElement('span');
            dot.className = `hero-dot ${idx === 0 ? 'active' : ''}`;
            dot.addEventListener('click', () => this.setHeroIndex(idx));
            this.dom.heroDots.appendChild(dot);
          });
        }

        if (this.dom.heroPrevBtn) {
          this.dom.heroPrevBtn.addEventListener('click', () => {
            this.setHeroIndex((this.heroIndex - 1 + this.heroFeaturedGames.length) % this.heroFeaturedGames.length);
          });
        }

        if (this.dom.heroNextBtn) {
          this.dom.heroNextBtn.addEventListener('click', () => {
            this.setHeroIndex((this.heroIndex + 1) % this.heroFeaturedGames.length);
          });
        }

        if (this.dom.heroPlayBtn) {
          this.dom.heroPlayBtn.addEventListener('click', () => {
            const g = this.heroFeaturedGames[this.heroIndex];
            if (g) this.openGameModal(g);
          });
        }

        this.updateHeroDisplay();

        this.startHeroTimer();
        this.dom.heroBanner.addEventListener('mouseenter', () => this.stopHeroTimer());
        this.dom.heroBanner.addEventListener('mouseleave', () => this.startHeroTimer());
      }

      setHeroIndex(index) {
        this.heroIndex = index;
        this.updateHeroDisplay();
      }

      updateHeroDisplay() {
        const game = this.heroFeaturedGames[this.heroIndex];
        if (!game) return;

        if (this.dom.heroTitle) {
          this.dom.heroTitle.textContent = game.title;
        }

        if (this.dom.heroSubtitle) {
          let sub = 'Dedicated Server';
          if (game.id === 'club-penguin') sub = 'Dedicated Server';
          else if (game.engine === 'ruffle') sub = 'Flash WASM Core';
          else if (game.category) sub = `${game.category} &#8226; Top Rated`;
          this.dom.heroSubtitle.textContent = sub;
        }

        if (this.dom.heroDots) {
          const dots = this.dom.heroDots.querySelectorAll('.hero-dot');
          dots.forEach((d, idx) => d.classList.toggle('active', idx === this.heroIndex));
        }
      }

      startHeroTimer() {
        this.stopHeroTimer();
        this.heroTimer = setInterval(() => {
          if (this.heroFeaturedGames.length > 1) {
            this.setHeroIndex((this.heroIndex + 1) % this.heroFeaturedGames.length);
          }
        }, 6000);
      }

      stopHeroTimer() {
        if (this.heroTimer) {
          clearInterval(this.heroTimer);
          this.heroTimer = null;
        }
      }


      renderCuratedRows() {
        if (this.dom.monoxidePicksRow) {
          const picksIds = [
            'undertale',
            'geometry-dash',
            'adofai',
            'super-mario-63',
            'bad-monday-simulator',
            'retro-bowl',
            'dan-the-man',
            'slope',
            '1v1-lol'
          ];
          this.populateCuratedRow(this.dom.monoxidePicksRow, picksIds);
        }

        if (this.dom.hotWeekRow) {
          const hotIds = [
            'retro-bowl',
            'geometry-dash',
            'undertale',
            '1v1-lol',
            'slope',
            'cookie-clicker',
            '2048',
            'bad-monday-simulator',
            'dan-the-man'
          ];
          this.populateCuratedRow(this.dom.hotWeekRow, hotIds);
        }
      }

      populateCuratedRow(container, idList) {
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();

        idList.forEach(id => {
          const game = this.catalog.find(x => x.id === id);
          if (!game) return;

          const card = document.createElement('div');
          card.className = 'curated-card';
          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          card.setAttribute('aria-label', `Play ${game.title}`);

          const safeTitle = (game.title || 'Game').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const catClass = (game.category || 'arcade').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');

          card.innerHTML = `
        <div class="curated-thumb-wrap">
          <div class="card-fallback-art cat-${catClass}">
            <div class="fallback-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75">
                <rect x="2" y="6" width="20" height="12" rx="4"></rect>
                <path d="M6 12h4m-2-2v4m9-3h.01m2 2h.01"></path>
              </svg>
            </div>
          </div>
          <img class="curated-thumb" src="${game.thumbnail || ''}" alt="" loading="lazy" onerror="this.style.display='none'">
        </div>
        <span class="curated-title">${safeTitle}</span>
      `;

          card.addEventListener('click', () => this.openGameModal(game));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              this.openGameModal(game);
            }
          });

          fragment.appendChild(card);
        });

        container.appendChild(fragment);
      }


      applyFilters() {
        const query = this.searchQuery;
        const cat = this.currentCategory;

        const standardCats = new Set(['Action', 'Arcade', 'Shooter', 'Sports', 'Racing', 'Puzzle', 'Multiplayer', 'Sandbox', 'Simulation', 'Adventure', 'Horror', 'Music', 'Strategy', 'Idle', 'Art', 'Dress Up']);

        this.filteredCatalog = this.catalog.filter(game => {
          if (cat === 'Favorites') {
            if (!this.favorites.has(game.id)) return false;
          } else if (cat === 'Popular') {
            if (!game.popular && (!game.rating || parseFloat(game.rating) < 4.7)) return false;
          } else if (cat === 'Other') {
            const gameCat = game.category || '';
            if (standardCats.has(gameCat) && gameCat.toLowerCase() !== 'other') return false;
          } else if (cat !== 'All') {
            if ((game.category || '').toLowerCase() !== cat.toLowerCase()) return false;
          }

          if (!query) return true;

          const titleMatch = game.title && game.title.toLowerCase().includes(query);
          const tagMatch = game.tags && game.tags.some(t => t.toLowerCase().includes(query));
          const descMatch = game.description && game.description.toLowerCase().includes(query);
          const catMatch = game.category && game.category.toLowerCase().includes(query);
          return titleMatch || tagMatch || descMatch || catMatch;
        });

        if (this.dom.catalogCount) {
          this.dom.catalogCount.textContent = `${this.filteredCatalog.length.toLocaleString()} games`;
        }

        if (this.dom.gameGrid) {
          this.dom.gameGrid.innerHTML = '';
          this.renderedCount = 0;

          if (this.filteredCatalog.length === 0) {
            if (this.dom.emptyState) this.dom.emptyState.classList.remove('hidden');
          } else {
            if (this.dom.emptyState) this.dom.emptyState.classList.add('hidden');
            this.renderNextChunk();
          }
        }
      }


      renderNextChunk() {
        if (this.isRendering || !this.dom.gameGrid) return;
        this.isRendering = true;

        const start = this.renderedCount;
        const end = Math.min(start + this.pageSize, this.filteredCatalog.length);
        const chunk = this.filteredCatalog.slice(start, end);

        const fragment = document.createDocumentFragment();

        chunk.forEach(game => {
          const card = document.createElement('article');
          card.className = 'game-card';
          card.tabIndex = 0;
          card.setAttribute('data-id', game.id);
          card.setAttribute('role', 'button');
          card.setAttribute('aria-label', `Play ${game.title}`);

          const isFav = this.favorites.has(game.id);
          const safeTitle = (game.title || 'Game').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const catClass = (game.category || 'arcade').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');

          card.innerHTML = `
        <div class="card-thumb-wrap">
          <div class="card-fallback-art cat-${catClass}">
            <div class="fallback-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75">
                <rect x="2" y="6" width="20" height="12" rx="4"></rect>
                <path d="M6 12h4m-2-2v4m9-3h.01m2 2h.01"></path>
              </svg>
            </div>
            <span class="fallback-title">${safeTitle}</span>
          </div>
          <img class="card-thumb" src="${game.thumbnail || ''}" alt="" loading="lazy" onerror="this.style.display='none'">
          <div class="card-overlay">
            <span class="play-indicator">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" style="vertical-align:-1px; margin-right:4px;">
                <polygon points="5 3 19 12 5 21 5 3"/>
              </svg>Play
            </span>
          </div>
          <button class="fav-btn ${isFav ? 'active' : ''}" data-fav-id="${game.id}" title="Toggle Favorite" aria-label="Favorite">
            <svg class="star-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          </button>
        </div>
        <div class="card-info">
          <h3 class="card-title">${safeTitle}</h3>
          <div class="card-meta">
            <span class="meta-cat">${game.category || 'Arcade'}</span>
          </div>
        </div>
      `;

          card.addEventListener('click', () => this.openGameModal(game));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              this.openGameModal(game);
            }
          });

          const favBtn = card.querySelector('.fav-btn');
          if (favBtn) {
            favBtn.addEventListener('click', (e) => this.toggleFavorite(game.id, e));
          }

          fragment.appendChild(card);
        });

        this.dom.gameGrid.appendChild(fragment);
        this.renderedCount = end;
        this.isRendering = false;
      }


      setupInfiniteScrollObserver() {
        if (!this.dom.infiniteSentinel) return;

        if (!('IntersectionObserver' in window)) {
          window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
              this.renderNextChunk();
            }
          });
          return;
        }

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && this.renderedCount < this.filteredCatalog.length) {
              this.renderNextChunk();
            }
          });
        }, {
          rootMargin: '400px'
        });

        observer.observe(this.dom.infiniteSentinel);
      }


      async openGameModal(game) {
        this.activeGame = game;

        if (this.dom.modalTitle) this.dom.modalTitle.textContent = game.title;

        if (this.dom.modal) this.dom.modal.classList.remove('hidden');
        document.body.classList.add('modal-open');

        const customKeys = (game.hardwareCompatibility && game.hardwareCompatibility.preventScrollKeys) || ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'];
        this.keyboardManager.bindGame(this.dom.gameContainer, customKeys);

        await this.runtimeLoader.mountGame(game);
      }


      closeGameModal() {
        if (!this.activeGame) return;

        this.runtimeLoader.dispose();
        this.keyboardManager.unbindGame();

        if (this.dom.modal) this.dom.modal.classList.add('hidden');
        document.body.classList.remove('modal-open');
        this.activeGame = null;

        if (this.dom.chordMonitor) this.dom.chordMonitor.innerHTML = '';
      }


      populateControlsGuide(game) {
        if (!this.dom.controlsContent) return;
        const guide = game.controls || {};
        let html = '';

        if (guide.summary) {
          html += `<div class="controls-summary-box"><strong>Quick Guide:</strong> ${guide.summary}</div>`;
        }

        const renderKeyMap = (title, map) => {
          if (!map) return '';
          let section = `<div class="controls-section"><h4>${title}</h4><div class="key-bindings-list">`;
          for (const [action, keyText] of Object.entries(map)) {
            const keycaps = keyText.split(/([/+,]|or)/i).map(part => {
              const trimmed = part.trim();
              if (!trimmed) return '';
              if (['/', '+', ',', 'or'].includes(trimmed.toLowerCase())) {
                return `<span class="key-sep">${trimmed}</span>`;
              }
              return `<kbd class="hardware-keycap">${trimmed.replace('Key', '')}</kbd>`;
            }).join(' ');

            section += `
          <div class="key-row">
            <span class="key-action-label">${action}</span>
            <div class="key-combo">${keycaps}</div>
          </div>
        `;
          }
          section += `</div></div>`;
          return section;
        };

        html += renderKeyMap('Player 1 Controls', guide.p1);
        html += renderKeyMap('Player 2 Controls (Local 2P)', guide.p2);

        this.dom.controlsContent.innerHTML = html;
      }


      updateActiveChordDisplay(chord) {
        if (!this.dom.chordMonitor) return;
        if (!chord || chord.length === 0) {
          this.dom.chordMonitor.innerHTML = '<span class="chord-idle">No keys held</span>';
          return;
        }

        const keycaps = chord.map(code => {
          const cleanLabel = code.replace('Key', '').replace('Arrow', '');
          return `<kbd class="active-hardware-keycap">${cleanLabel}</kbd>`;
        }).join('');

        this.dom.chordMonitor.innerHTML = `<span class="chord-label">Active Chord (${chord.length}):</span> ${keycaps}`;
      }

      toggleControlsGuide() {
        if (!this.dom.controlsPanel) return;
        this.dom.controlsPanel.classList.toggle('open');
        setTimeout(() => {
          this.keyboardManager.reclaimFocus();
        }, 50);
      }

      toggleFullscreen() {
        const modal = this.dom.modal;
        if (!modal) return;
        const isModalFs = modal.classList.toggle('modal-fullscreen-active');

        try {
          const el = this.dom.modal;
          const req = el.requestFullscreen || el.webkitRequestFullscreen || document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
          const exit = document.exitFullscreen || document.webkitExitFullscreen;

          if (isModalFs && req) {
            const p = req.call(el);
            if (p && p.catch) p.catch(() => { });
          } else if (!isModalFs && exit) {
            const p = exit.call(document);
            if (p && p.catch) p.catch(() => { });
          }
        } catch (e) { }

        setTimeout(() => {
          this.keyboardManager.reclaimFocus();
        }, 80);
      }

      togglePortalFullscreen() {
        const isDocFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        const docEl = document.documentElement;

        if (!isDocFs) {
          document.body.classList.add('fullscreen-mode');
          let req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
          if (req) {
            try {
              const p = req.call(docEl);
              if (p && p.catch) p.catch(() => { });
            } catch (e) { }
          }
        } else {
          document.body.classList.remove('fullscreen-mode');
          let exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
          if (exit) {
            try {
              const p = exit.call(document);
              if (p && p.catch) p.catch(() => { });
            } catch (e) { }
          }
        }
        this.onFullscreenChange();
      }

      onFullscreenChange() {
        const isFs = document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains('fullscreen-mode');
        const fsBtn = document.getElementById('portal-fullscreen-btn');
        if (fsBtn) {
          fsBtn.classList.toggle('active', !!isFs);
          const textSpan = fsBtn.querySelector('.fs-btn-text');
          if (textSpan) {
            textSpan.textContent = isFs ? 'Exit Full' : 'Fullscreen';
          }
        }
      }

      retryActiveGame() {
        if (this.activeGame) {
          this.runtimeLoader.mountGame(this.activeGame);
        }
      }
    }

    function bootPortal() {
      if (window.activePortalApp) return;
      window.activePortalApp = new GamePortalApp();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootPortal);
    } else {
      bootPortal();
    }
  </script>
</body>
